name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push image via ACR
        run: |
          az acr build --registry acropenhexa \
            --image immo-back:${{ github.sha }} \
            --file Dockerfile.deploy .

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name ca-immo-back \
            --resource-group rg-openhexa \
            --image acropenhexa.azurecr.io/immo-back:${{ github.sha }}

      # Le job d'ingestion partage l'image du serveur web, avec une commande
      # différente. L'étape est ignorée tant que le job n'a pas été créé (voir
      # PLAN_DEPLOIEMENT_AZURE.md) : le déploiement web ne doit pas échouer
      # pour autant.
      - name: Deploy ingestion job (if it exists)
        run: |
          if az containerapp job show --name caj-immo-ingest --resource-group rg-openhexa >/dev/null 2>&1; then
            az containerapp job update \
              --name caj-immo-ingest \
              --resource-group rg-openhexa \
              --image acropenhexa.azurecr.io/immo-back:${{ github.sha }}
          else
            echo "Job caj-immo-ingest absent : etape ignoree."
          fi
