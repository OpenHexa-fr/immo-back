name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # openhexa-core n'est pas encore publié sur PyPI : même source que
      # Dockerfile.deploy, sans quoi `pip install -e .` échoue à le résoudre.
      - run: pip install "git+https://github.com/OpenHexa-fr/core.git@main"
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - run: pytest

  deploy:
    # Le déploiement ne part que si la suite passe : sans cette dépendance, les
    # tests tourneraient en parallèle de la mise en production qu'ils sont
    # censés protéger.
    needs: test
    # Les tests tournent sur les PR, le déploiement non : le credential fédéré
    # OIDC n'est de toute façon accordé qu'à `refs/heads/main`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push image via ACR
        run: |
          az acr build --registry acropenhexa \
            --image immo-back:${{ github.sha }} \
            --file Dockerfile.deploy .

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name ca-immo-back \
            --resource-group rg-openhexa \
            --image acropenhexa.azurecr.io/immo-back:${{ github.sha }}

      # Le job d'ingestion partage l'image du serveur web, avec une commande
      # différente. L'étape est ignorée tant que le job n'a pas été créé (voir
      # PLAN_DEPLOIEMENT_AZURE.md) : le déploiement web ne doit pas échouer
      # pour autant.
      - name: Deploy ingestion job (if it exists)
        run: |
          if az containerapp job show --name caj-immo-ingest --resource-group rg-openhexa >/dev/null 2>&1; then
            az containerapp job update \
              --name caj-immo-ingest \
              --resource-group rg-openhexa \
              --image acropenhexa.azurecr.io/immo-back:${{ github.sha }}
          else
            echo "Job caj-immo-ingest absent : etape ignoree."
          fi
