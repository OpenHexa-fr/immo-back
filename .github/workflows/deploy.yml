name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & push image via ACR
        run: |
          az acr build --registry acropenhexa \
            --image immo-back:${{ github.sha }} \
            --file Dockerfile.deploy .

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name ca-immo-back \
            --resource-group rg-openhexa \
            --image acropenhexa.azurecr.io/immo-back:${{ github.sha }}
